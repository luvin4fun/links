
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171719">
  <meta name="description" content="Connect with Luvin4fun. Friendship, shared adventures, and new experiences.">
  <title>Luvin4fun | Let's Connect</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 36px 18px;
      display: grid;
      place-items: center;
      background: #171719;
      color: #f5e8ec;
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border: 1px solid #72505b;
      border-radius: 50%;
      color: #d4a6b2;
      font-size: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 9vw, 48px);
      letter-spacing: 1px;
    }

    .tagline {
      margin: 12px 0 22px;
      color: #d4a6b2;
      font-size: 16px;
      font-style: italic;
    }

    .intro {
      margin: 0 auto 28px;
      max-width: 360px;
      color: #d1c9cd;
      font-family: Arial, sans-serif;
      font-size: 15px;
      line-height: 1.7;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .links a {
      display: block;
      padding: 16px;
      border: 1px solid #644753;
      border-radius: 10px;
      background: #30262c;
      color: #f5e8ec;
      font-family: Arial, sans-serif;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: background .2s ease;
    }

    .links a:hover,
    .links a:focus-visible {
      background: #49323c;
      outline: 2px solid #d4a6b2;
      outline-offset: 3px;
    }

    footer {
      margin-top: 28px;
      color: #b8aab0;
      font-family: Arial, sans-serif;
      font-size: 12px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">♡</div>
    <h1>Luvin4fun</h1>
    <p class="tagline">Real connection. Shared adventures.</p>

    <p class="intro">
      We're a longtime couple who enjoy meeting genuine people,
      building friendships, and discovering new experiences together.
    </p>

    <nav class="links" aria-label="Our profiles">
      <a href="https://REPLACE-WITH-SDC-PROFILE"
         target="_blank" rel="noopener noreferrer">
        Our SDC Profile
      </a>
      <a href="https://REPLACE-WITH-KASIDIE-PROFILE"
         target="_blank" rel="noopener noreferrer">
        Find Us on Kasidie
      </a>
      <a href="https://REPLACE-WITH-TELEGRAM-LINK"
         target="_blank" rel="noopener noreferrer">
        Connect on Telegram
      </a>
    </nav>

    <footer>
      Friendship · Travel · Sensual Experiences
      <br>
      Let's Connect!
    </footer>
  </main>
</body>
</html>
